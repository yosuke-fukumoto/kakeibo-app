<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efead9;
    --paper-raised: #f6f2e6;
    --line: #d9cfb5;
    --ink: #24303d;
    --ink-soft: #5b6b7a;
    --income: #2f5233;
    --expense: #a6362c;
    --accent: #8b6f3e;
    --accent-soft: #e4d9bb;
    --radius: 10px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1d2420;
      --paper-raised: #262f2a;
      --line: #3b463e;
      --ink: #ece6d6;
      --ink-soft: #a9b3a6;
      --income: #7fbf8a;
      --expense: #e08276;
      --accent: #d8c184;
      --accent-soft: #3a3527;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1d2420;
    --paper-raised: #262f2a;
    --line: #3b463e;
    --ink: #ece6d6;
    --ink-soft: #a9b3a6;
    --income: #7fbf8a;
    --expense: #e08276;
    --accent: #d8c184;
    --accent-soft: #3a3527;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  h1 {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.04em;
    margin: 0 0 4px;
  }
  .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 24px; }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .month-nav button {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 999px;
    width: 36px; height: 36px;
    font-size: 16px;
    cursor: pointer;
  }
  .month-nav button:hover { background: var(--accent-soft); }
  .month-label {
    font-family: "Shippori Mincho", serif;
    font-size: 19px;
    font-weight: 500;
  }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-family: "Shippori Mincho", serif;
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .summary-row { display: flex; gap: 12px; }
  .stat { flex: 1; text-align: center; }
  .stat .num {
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 700;
    display: block;
  }
  .stat .cap { font-size: 12px; color: var(--ink-soft); }
  .stat.income .num { color: var(--income); }
  .stat.expense .num { color: var(--expense); }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-toggle button {
    flex: 1;
    padding: 9px 0;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .type-toggle button.active[data-type="expense"] {
    background: var(--expense); color: #fff; border-color: var(--expense);
  }
  .type-toggle button.active[data-type="income"] {
    background: var(--income); color: #fff; border-color: var(--income);
  }

  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  .btn-main {
    width: 100%;
    padding: 11px 0;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-main:hover { opacity: 0.9; }

  details summary {
    cursor: pointer;
    font-family: "Shippori Mincho", serif;
    font-size: 16px;
    list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; color: var(--accent); }
  details[open] summary::before { content: "▾ "; }
  details .card { margin-top: 14px; margin-bottom: 0; }

  .fixed-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .fixed-item:last-child { border-bottom: none; }
  .fixed-item .meta { color: var(--ink-soft); font-size: 12px; }
  .fixed-item .amt { font-variant-numeric: tabular-nums; margin-left: auto; margin-right: 10px; }
  .del-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
  }
  .del-btn:hover { color: var(--expense); }

  .ledger { margin-top: 22px; }
  .ledger-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .ledger-row .date { font-size: 12px; color: var(--ink-soft); width: 42px; flex-shrink: 0; }
  .ledger-row .info { flex: 1; min-width: 0; }
  .ledger-row .cat { font-size: 13px; color: var(--ink-soft); }
  .ledger-row .memo { font-size: 14px; }
  .ledger-row .tag {
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0 4px;
    margin-left: 6px;
  }
  .ledger-row .amt {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    white-space: nowrap;
  }
  .ledger-row .amt.expense { color: var(--expense); }
  .ledger-row .amt.income { color: var(--income); }

  .empty { color: var(--ink-soft); font-size: 13px; text-align: center; padding: 20px 0; }

  .cal-head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .cal-head span {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-cell {
    min-height: 60px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 3px;
    background: var(--paper);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cal-cell:hover { background: var(--accent-soft); }
  .cal-cell.empty-cell { visibility: hidden; cursor: default; }
  .cal-cell.today { border-color: var(--accent); border-width: 2px; }
  .cal-cell.selected { background: var(--accent-soft); border-color: var(--accent); }
  .cal-cell .d-num {
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .cal-cell .d-amt {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
    word-break: break-all;
  }
  .cal-cell .d-amt.expense { color: var(--expense); }
  .cal-cell .d-amt.income { color: var(--income); }

  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .filter-chip button {
    background: none;
    border: none;
    color: var(--ink);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>家計簿</h1>
  <p class="sub">固定費は登録しておけば、毎月自動で計上されます。</p>

  <div class="month-nav">
    <button id="prevMonth" aria-label="前の月">←</button>
    <span class="month-label" id="monthLabel"></span>
    <button id="nextMonth" aria-label="次の月">→</button>
  </div>

  <div class="card">
    <div class="summary-row">
      <div class="stat income">
        <span class="num" id="sumIncome">¥0</span>
        <span class="cap">収入</span>
      </div>
      <div class="stat expense">
        <span class="num" id="sumExpense">¥0</span>
        <span class="cap">支出</span>
      </div>
      <div class="stat">
        <span class="num" id="sumBalance">¥0</span>
        <span class="cap">差引</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>カレンダー</h2>
    <div class="cal-head">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card">
    <h2>記録する</h2>
    <div class="type-toggle">
      <button type="button" data-type="expense" class="active">支出</button>
      <button type="button" data-type="income">収入</button>
    </div>
    <div class="row2">
      <div class="field">
        <label for="txDate">日付</label>
        <input type="date" id="txDate">
      </div>
      <div class="field">
        <label for="txAmount">金額</label>
        <input type="number" id="txAmount" inputmode="numeric" placeholder="0">
      </div>
    </div>
    <div class="field">
      <label for="txCategory">カテゴリ</label>
      <input list="categoryList" id="txCategory" placeholder="例：食費">
      <datalist id="categoryList"></datalist>
    </div>
    <div class="field">
      <label for="txMemo">メモ（任意）</label>
      <input type="text" id="txMemo" placeholder="例：スーパーで買い物">
    </div>
    <button class="btn-main" id="addTx">記録する</button>
  </div>

  <details>
    <summary>固定費を管理する（ローンなど）</summary>
    <div class="card">
      <div id="fixedList"></div>
      <div class="row2" style="margin-top:10px;">
        <div class="field">
          <label for="fxName">名称</label>
          <input type="text" id="fxName" placeholder="例：住宅ローン">
        </div>
        <div class="field">
          <label for="fxAmount">金額</label>
          <input type="number" id="fxAmount" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fxCategory">カテゴリ</label>
          <input list="categoryList" id="fxCategory" placeholder="例：住居費">
        </div>
        <div class="field">
          <label for="fxFrequency">頻度</label>
          <select id="fxFrequency">
            <option value="monthly">毎月</option>
            <option value="weekly">毎週</option>
            <option value="daily">毎日</option>
          </select>
        </div>
      </div>
      <div class="field" id="fxMonthlyField">
        <label for="fxDay">毎月の支払日</label>
        <input type="number" id="fxDay" min="1" max="31" value="27">
      </div>
      <div class="field" id="fxWeeklyField" style="display:none;">
        <label for="fxStartDate" id="fxStartDateLabel">最初の支払日（この曜日で毎週繰り返します）</label>
        <input type="date" id="fxStartDate">
      </div>
      <button class="btn-main" id="addFixed">固定費として登録する</button>
    </div>
  </details>

  <div class="ledger">
    <h2 style="font-family:'Shippori Mincho',serif; font-weight:500; font-size:16px;">この月の明細</h2>
    <div id="txList"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "kakeibo_data_v1";
  var DEFAULT_CATEGORIES = ["食費","住居費","光熱費","通信費","交通費","日用品","娯楽","医療","給与","副収入","その他"];

  function pad(n) { return String(n).padStart(2, "0"); }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function ymOf(dateStr) { return dateStr.slice(0, 7); }
  function daysInMonth(ym) {
    var parts = ym.split("-").map(Number);
    return new Date(parts[0], parts[1], 0).getDate();
  }
  function addMonths(ym, delta) {
    var parts = ym.split("-").map(Number);
    var y = parts[0], m = parts[1] - 1 + delta;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + "-" + pad(m + 1);
  }
  function ymCompare(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function yen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function monthLabelText(ym) {
    var parts = ym.split("-").map(Number);
    return parts[0] + "年" + parts[1] + "月";
  }

  var todayYM = ymOf(todayISO());

  var state = { transactions: [], fixed: [], viewYM: todayYM, selectedDate: null };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.transactions = parsed.transactions || [];
        state.fixed = parsed.fixed || [];
      }
    } catch (e) {
      console.error("読み込みエラー", e);
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        transactions: state.transactions,
        fixed: state.fixed
      }));
    } catch (e) {
      console.error("保存エラー", e);
    }
  }

  function addDays(dateStr, n) {
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function generateMonthlyFixed(f) {
    var changed = false;
    var ym = f.startYM;
    while (ymCompare(ym, todayYM) <= 0) {
      var already = state.transactions.some(function (t) {
        return t.fixedId === f.id && t.ym === ym;
      });
      var skipped = (f.skipped || []).indexOf(ym) !== -1;
      if (!already && !skipped) {
        var day = Math.min(f.day, daysInMonth(ym));
        state.transactions.push({
          id: uid(),
          date: ym + "-" + pad(day),
          ym: ym,
          type: "expense",
          category: f.category,
          amount: f.amount,
          memo: f.name,
          isFixed: true,
          fixedId: f.id
        });
        changed = true;
      }
      ym = addMonths(ym, 1);
    }
    return changed;
  }

  function generateWeeklyFixed(f) {
    var changed = false;
    var d = f.startDate;
    var guard = 0;
    while (d <= todayISO() && guard < 5000) {
      guard++;
      var already = state.transactions.some(function (t) {
        return t.fixedId === f.id && t.date === d;
      });
      var skipped = (f.skipped || []).indexOf(d) !== -1;
      if (!already && !skipped) {
        state.transactions.push({
          id: uid(),
          date: d,
          ym: ymOf(d),
          type: "expense",
          category: f.category,
          amount: f.amount,
          memo: f.name,
          isFixed: true,
          fixedId: f.id
        });
        changed = true;
      }
      d = addDays(d, 7);
    }
    return changed;
  }

  function generateDailyFixed(f) {
    var changed = false;
    var d = f.startDate;
    var guard = 0;
    while (d <= todayISO() && guard < 5000) {
      guard++;
      var already = state.transactions.some(function (t) {
        return t.fixedId === f.id && t.date === d;
      });
      var skipped = (f.skipped || []).indexOf(d) !== -1;
      if (!already && !skipped) {
        state.transactions.push({
          id: uid(),
          date: d,
          ym: ymOf(d),
          type: "expense",
          category: f.category,
          amount: f.amount,
          memo: f.name,
          isFixed: true,
          fixedId: f.id
        });
        changed = true;
      }
      d = addDays(d, 1);
    }
    return changed;
  }

  function generateFixedTransactions() {
    var changed = false;
    state.fixed.forEach(function (f) {
      if (f.frequency === "weekly") {
        if (generateWeeklyFixed(f)) changed = true;
      } else if (f.frequency === "daily") {
        if (generateDailyFixed(f)) changed = true;
      } else {
        if (generateMonthlyFixed(f)) changed = true;
      }
    });
    if (changed) save();
  }

  function getCategories() {
    var set = {};
    DEFAULT_CATEGORIES.forEach(function (c) { set[c] = true; });
    state.transactions.forEach(function (t) { set[t.category] = true; });
    state.fixed.forEach(function (f) { set[f.category] = true; });
    return Object.keys(set);
  }

  function render() {
    document.getElementById("monthLabel").textContent = monthLabelText(state.viewYM);

    var monthTx = state.transactions
      .filter(function (t) { return t.ym === state.viewYM; })
      .sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });

    var income = 0, expense = 0;
    monthTx.forEach(function (t) {
      if (t.type === "income") income += t.amount;
      else expense += t.amount;
    });
    document.getElementById("sumIncome").textContent = yen(income);
    document.getElementById("sumExpense").textContent = yen(expense);
    document.getElementById("sumBalance").textContent = yen(income - expense);

    var catList = document.getElementById("categoryList");
    catList.innerHTML = "";
    getCategories().forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c;
      catList.appendChild(opt);
    });

    renderCalendar(monthTx);

    var txListEl = document.getElementById("txList");
    txListEl.innerHTML = "";

    var listTx = state.selectedDate
      ? monthTx.filter(function (t) { return t.date === state.selectedDate; })
      : monthTx;

    if (state.selectedDate) {
      var chip = document.createElement("div");
      chip.className = "filter-chip";
      var dnum = parseInt(state.selectedDate.slice(8, 10), 10);
      chip.innerHTML = dnum + '日の記録のみ表示中 <button id="clearDateFilter">✕ 解除</button>';
      txListEl.appendChild(chip);
    }

    if (listTx.length === 0) {
      var msg = document.createElement("div");
      msg.className = "empty";
      msg.textContent = state.selectedDate ? "この日の記録はありません。" : "この月の記録はまだありません。";
      txListEl.appendChild(msg);
    } else {
      listTx.forEach(function (t) {
        var row = document.createElement("div");
        row.className = "ledger-row";
        var dayNum = t.date.slice(8, 10);
        row.innerHTML =
          '<div class="date">' + dayNum + '日</div>' +
          '<div class="info">' +
            '<span class="cat">' + escapeHtml(t.category) + '</span>' +
            (t.memo ? ' <span class="memo">' + escapeHtml(t.memo) + '</span>' : '') +
            (t.isFixed ? '<span class="tag">自動</span>' : '') +
          '</div>' +
          '<div class="amt ' + t.type + '">' + (t.type === "expense" ? "-" : "+") + yen(t.amount) + '</div>' +
          '<button class="del-btn" data-id="' + t.id + '" aria-label="削除">✕</button>';
        txListEl.appendChild(row);
      });
    }

    var fixedListEl = document.getElementById("fixedList");
    fixedListEl.innerHTML = "";
    if (state.fixed.length === 0) {
      fixedListEl.innerHTML = '<div class="empty">まだ固定費は登録されていません。</div>';
    } else {
      state.fixed.forEach(function (f) {
        var item = document.createElement("div");
        item.className = "fixed-item";
        var meta;
        if (f.frequency === "weekly") {
          var wd = ["日", "月", "火", "水", "木", "金", "土"][new Date(f.startDate + "T00:00:00").getDay()];
          meta = "毎週" + wd + "曜日";
        } else if (f.frequency === "daily") {
          meta = "毎日";
        } else {
          meta = "毎月" + f.day + "日";
        }
        item.innerHTML =
          '<div>' + escapeHtml(f.name) +
            '<div class="meta">' + escapeHtml(f.category) + '・' + meta + '</div>' +
          '</div>' +
          '<div class="amt">' + yen(f.amount) + '</div>' +
          '<button class="del-btn" data-fx="' + f.id + '" aria-label="固定費を削除">✕</button>';
        fixedListEl.appendChild(item);
      });
    }
  }

  function renderCalendar(monthTx) {
    var byDate = {};
    monthTx.forEach(function (t) {
      if (!byDate[t.date]) byDate[t.date] = { income: 0, expense: 0 };
      byDate[t.date][t.type] += t.amount;
    });

    var parts = state.viewYM.split("-").map(Number);
    var year = parts[0], month = parts[1];
    var firstWeekday = new Date(year, month - 1, 1).getDay();
    var totalDays = daysInMonth(state.viewYM);

    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    for (var i = 0; i < firstWeekday; i++) {
      var blank = document.createElement("div");
      blank.className = "cal-cell empty-cell";
      grid.appendChild(blank);
    }

    for (var d = 1; d <= totalDays; d++) {
      var dateStr = state.viewYM + "-" + pad(d);
      var cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cal-cell";
      if (dateStr === todayISO()) cell.classList.add("today");
      if (dateStr === state.selectedDate) cell.classList.add("selected");
      cell.setAttribute("data-date", dateStr);

      var html = '<span class="d-num">' + d + '</span>';
      var day = byDate[dateStr];
      if (day) {
        if (day.expense) html += '<span class="d-amt expense">-' + yen(day.expense) + '</span>';
        if (day.income) html += '<span class="d-amt income">+' + yen(day.income) + '</span>';
      }
      cell.innerHTML = html;
      grid.appendChild(cell);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // --- イベント ---
  var currentType = "expense";
  document.querySelectorAll(".type-toggle button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      currentType = btn.getAttribute("data-type");
      document.querySelectorAll(".type-toggle button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
    });
  });

  document.getElementById("txDate").value = todayISO();

  document.getElementById("addTx").addEventListener("click", function () {
    var date = document.getElementById("txDate").value || todayISO();
    var amount = parseFloat(document.getElementById("txAmount").value);
    var category = document.getElementById("txCategory").value.trim();
    var memo = document.getElementById("txMemo").value.trim();

    if (!amount || amount <= 0) { alert("金額を入力してください。"); return; }
    if (!category) { alert("カテゴリを入力してください。"); return; }

    state.transactions.push({
      id: uid(),
      date: date,
      ym: ymOf(date),
      type: currentType,
      category: category,
      amount: amount,
      memo: memo,
      isFixed: false
    });
    save();
    document.getElementById("txAmount").value = "";
    document.getElementById("txMemo").value = "";
    state.viewYM = ymOf(date);
    render();
  });

  document.getElementById("fxStartDate").value = todayISO();

  document.getElementById("fxFrequency").addEventListener("change", function () {
    var freq = this.value;
    var showDateField = (freq === "weekly" || freq === "daily");
    document.getElementById("fxMonthlyField").style.display = showDateField ? "none" : "block";
    document.getElementById("fxWeeklyField").style.display = showDateField ? "block" : "none";
    document.getElementById("fxStartDateLabel").textContent =
      freq === "daily" ? "開始日（この日から毎日計上されます）" : "最初の支払日（この曜日で毎週繰り返します）";
  });

  document.getElementById("addFixed").addEventListener("click", function () {
    var name = document.getElementById("fxName").value.trim();
    var amount = parseFloat(document.getElementById("fxAmount").value);
    var category = document.getElementById("fxCategory").value.trim();
    var frequency = document.getElementById("fxFrequency").value;

    if (!name) { alert("名称を入力してください。"); return; }
    if (!amount || amount <= 0) { alert("金額を入力してください。"); return; }
    if (!category) { alert("カテゴリを入力してください。"); return; }

    var newFixed = {
      id: uid(),
      name: name,
      category: category,
      amount: amount,
      frequency: frequency,
      skipped: []
    };

    if (frequency === "weekly" || frequency === "daily") {
      var startDate = document.getElementById("fxStartDate").value || todayISO();
      newFixed.startDate = startDate;
    } else {
      var day = parseInt(document.getElementById("fxDay").value, 10);
      if (!day || day < 1 || day > 31) { day = 27; }
      newFixed.day = day;
      newFixed.startYM = state.viewYM;
    }

    state.fixed.push(newFixed);
    save();
    generateFixedTransactions();
    document.getElementById("fxName").value = "";
    document.getElementById("fxAmount").value = "";
    document.getElementById("fxCategory").value = "";
    render();
  });

  document.getElementById("txList").addEventListener("click", function (e) {
    var btn = e.target.closest(".del-btn[data-id]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var tx = state.transactions.find(function (t) { return t.id === id; });
    if (!tx) return;
    if (tx.isFixed) {
      var f = state.fixed.find(function (f) { return f.id === tx.fixedId; });
      if (f) {
        f.skipped = f.skipped || [];
        var skipKey = (f.frequency === "weekly" || f.frequency === "daily") ? tx.date : tx.ym;
        if (f.skipped.indexOf(skipKey) === -1) f.skipped.push(skipKey);
      }
    }
    state.transactions = state.transactions.filter(function (t) { return t.id !== id; });
    save();
    render();
  });

  document.getElementById("fixedList").addEventListener("click", function (e) {
    var btn = e.target.closest(".del-btn[data-fx]");
    if (!btn) return;
    var id = btn.getAttribute("data-fx");
    if (!confirm("この固定費を削除しますか？過去に自動登録された記録は残ります。")) return;
    state.fixed = state.fixed.filter(function (f) { return f.id !== id; });
    save();
    render();
  });

  document.getElementById("prevMonth").addEventListener("click", function () {
    state.viewYM = addMonths(state.viewYM, -1);
    state.selectedDate = null;
    render();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    state.viewYM = addMonths(state.viewYM, 1);
    state.selectedDate = null;
    render();
  });

  document.getElementById("calGrid").addEventListener("click", function (e) {
    var cell = e.target.closest(".cal-cell[data-date]");
    if (!cell) return;
    var date = cell.getAttribute("data-date");
    state.selectedDate = (state.selectedDate === date) ? null : date;
    render();

    if (state.selectedDate) {
      document.getElementById("txDate").value = state.selectedDate;
      document.getElementById("txAmount").focus();
    }
  });

  document.getElementById("txList").addEventListener("click", function (e) {
    if (e.target.id === "clearDateFilter") {
      state.selectedDate = null;
      render();
    }
  });

  load();
  generateFixedTransactions();
  render();
})();
</script>
</body>
</html>
